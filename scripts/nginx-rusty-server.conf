# Nginx Configuration for Rusty Server
# Place this file at: /etc/nginx/sites-available/rusty-server
# Then create symlink: sudo ln -s /etc/nginx/sites-available/rusty-server /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or IP

    # Logging
    access_log /var/log/nginx/rusty-server-access.log;
    error_log /var/log/nginx/rusty-server-error.log;

    # Increase timeouts for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings
        proxy_buffering off;
    }

    # Health check endpoint (optional - can be public)
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }
}

